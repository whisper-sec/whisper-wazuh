<!--
  whisper-wazuh dev agent configuration.
  Enrolls automatically with the single-node manager (passwordless authd) and
  produces alerts via FIM, SCA, and a demo log source for IOC-bearing events.
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <port>1515</port>
      <agent_name>dev-agent</agent_name>
    </enrollment>
  </client>

  <!-- File integrity monitoring: touch a file under /etc to trigger an alert -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/etc</directories>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <!-- Security configuration assessment: emits alerts on start -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Demo log source: append IOC-bearing lines here to generate alerts.
       e.g. an SSH brute-force line yields rule 5710 with data.srcip set. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/wazuh-demo.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>