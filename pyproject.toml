# Tooling for the whisper-wazuh connector (CONTRIBUTING: Python + ruff + pytest).
# The shipped script (integrations/whisper/custom-whisper.py) runs on the manager's
# bundled Python 3.10 — stdlib only; target-version is pinned accordingly.

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["integrations/whisper/*.py", "tests/*.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
# UP037/UP007: the shipped script uses quoted `'str | None'` annotations on purpose —
# keep them as strings for maximum runtime compatibility on the bundled interpreter.
ignore = ["UP037"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"